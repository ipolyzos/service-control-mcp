version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - exhaustive
    - gocritic
    - godot
    - gofmt
    - noctx
    - prealloc
    - revive
    - stylecheck
    - thelper
    - unparam
    - whitespace

  settings:
    govet:
      enable-all: true
    revive:
      rules:
        - name: exported
          severity: warning
    stylecheck:
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
    exhaustive:
      default-signifies-exhaustive: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclusions:
    rules:
      - path: "_test\\.go$"
        linters:
          - gocritic
          - unparam
