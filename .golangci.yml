version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - exhaustive
    - gocritic
    - godot
    - gofmt
    - noctx
    - prealloc
    - revive
    - thelper
    - unparam
    - whitespace

  settings:
    govet:
      enable-all: true
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          severity: warning
