name: Feature request
description: Suggest a new tool, platform adapter, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you'd like and the problem it solves.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What gap or limitation does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the new tool, option, or behavior look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about
